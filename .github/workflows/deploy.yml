name: CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nobodyyy-dev/trp-lab09-docker

jobs:
  # CI: проверка, что проект собирается и публикуется
  build:
    name: Сборка .NET-проекта
    runs-on: ubuntu-latest
    steps:
    - name: Проверка кода из репозитория
      uses: actions/checkout@v4

    - name: Установка .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Восстановление зависимостей
      run: dotnet restore

    - name: Сборка
      run: dotnet build -c Release --no-restore

    - name: Публикация
      run: dotnet publish -c Release -o ./publish --no-build

  # CD (доставка): сборка Docker-образа и публикация в GitHub Container Registry
  docker:
    name: Сборка и публикация Docker-образа
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Проверка кода из репозитория
      uses: actions/checkout@v4

    - name: Настройка Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Вход в GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Сборка и публикация образа
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}

  # CD (развёртывание): запуск опубликованного образа и проверка, что приложение отвечает
  deploy:
    name: Развёртывание и проверка
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
    - name: Вход в GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Запуск контейнера из реестра
      run: |
        docker run -d -p 8080:8080 --name backend-container ${{ env.IMAGE }}:${{ github.sha }}
        docker ps

    - name: Проверка работы приложения
      run: |
        for i in $(seq 1 15); do
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
          if [ "$code" = "200" ]; then echo "Приложение отвечает: HTTP $code"; break; fi
          sleep 2
        done
        [ "$code" = "200" ] || { docker logs backend-container; exit 1; }
        curl -s -o /dev/null -w "Страница /Predictions: HTTP %{http_code}\n" http://localhost:8080/Predictions
